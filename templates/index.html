<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitBuddy - AI Workout Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>💪 FitBuddy - AI Workout Generator</h1>
        <p>Get a personalized 3-day workout plan & nutrition tip</p>

        <form action="/generate-workout" method="post" class="card">
            <label>Name:</label>
            <input type="text" name="username" required>

            <label>User ID (any number, remember it!):</label>
            <input type="number" name="user_id" required>

            <label>Age:</label>
            <input type="number" name="age" required>

            <label>Weight (kg):</label>
            <input type="number" step="0.1" name="weight" required>

            <label>Fitness Goal:</label>
            <select name="goal" required>
                <option value="weight loss">Weight Loss</option>
                <option value="muscle gain">Muscle Gain</option>
                <option value="general fitness">General Fitness</option>
            </select>

            <label>Workout Intensity:</label>
            <select name="intensity" required>
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>

            <button type="submit">Generate Plan</button>
        </form>

        <p style="text-align:center;">
            <a href="/view-all-users">View All Users (Admin)</a>
        </p>
    </div>
</body>
</html>
